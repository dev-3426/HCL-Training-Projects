<div class="student-wrapper">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">E</span>
      <span>Enrollora</span>
    </div>

    <nav class="sidebar-section">
      <small class="section-label">STUDENT MENU</small>

      <a routerLink="/student/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">▦</span>
        Dashboard
      </a>

      <a routerLink="/student/courses" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">▤</span>
        Available Courses
      </a>

      <a routerLink="/student/enrollments" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">▣</span>
        My Enrollments
      </a>

      <a routerLink="/student/cancellations" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">↻</span>
        Cancellation Requests
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="student-avatar">S</div>
      <div class="student-info">
        <strong>Student</strong>
        <small>Learning Portal</small>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div>
        <span class="topbar-title">Student Portal</span>
        <small class="topbar-subtitle">Build your learning journey</small>
      </div>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
